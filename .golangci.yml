version: "2"
run:
  go: "1.27"
  build-tags:
    - with_quic
    - with_dhcp
    - with_wireguard
    - with_utls
    - with_acme
    - with_clash_api
    - with_tailscale
    - with_ccm
    - with_ocm
    - badlinkname
    - tfogo_checklinkname0
linters:
  default: none
  enable:
    - ineffassign
    - staticcheck
    - unused
    - modernize
  settings:
    modernize:
      disable:
        - omitzero # nested struct omitempty -> omitzero changes JSON output semantics
        # Go 1.27 lets a composite literal name a promoted field. Applying it rewrites
        # about 100 literals in upstream sing-box code, which the weekly upstream sync
        # would then conflict with; enable it again once upstream moves to Go 1.27.
        - embedlit
    staticcheck:
      checks:
        - all
        - -QF1008 # could remove embedded field "<interface>" from selector
        - -ST1003 # should not use ALL_CAPS in Go names; use CamelCase instead
        - -QF1001 # could apply De Morgan's law
        - -SA4023 # impossible nil comparison, false positive on platform-specific implementations
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
    rules:
      - linters:
          - staticcheck
        text: 'SA1019: \(?\*?golang\.org/x/net/http2\.'
    paths:
      - transport/simple-obfs
      - \.pb\.go$
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - prefix(github.com/sagernet/,github.com/pasadizo-net/)
        - default
      custom-order: true
