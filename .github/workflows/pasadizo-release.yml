# Release: on a tag like v1.15.0-alpha.14-pasadizo.2, run CI, then GoReleaser
# (.goreleaser.yaml): static binaries for linux amd64, arm64 and armv7 (with
# NaiveProxy and its libcronet.so) and darwin amd64 and arm64 in tar.gz archives, deb and rpm packages, checksums,
# a GitHub release, the Homebrew cask in pasadizo-net/homebrew-tap and the AUR
# package pasadizo-bin. Then attest the provenance of every file in
# checksums.txt.
#
# The Homebrew cask needs the secret HOMEBREW_TAP_KEY, the private half of a
# deploy key with write access on pasadizo-net/homebrew-tap, and the AUR
# package needs the secret AUR_KEY, the private half of an SSH key registered
# on the AUR account of the package's maintainer. Without a secret, its step is
# skipped and the rest of the release still runs.
#
# GoReleaser writes the AUR package's PKGBUILD and .SRCINFO but does not push
# them: .github/pasadizo/aur-publish.sh adds `options=('!strip')`, which
# GoReleaser cannot write, so makepkg installs the attested binary unchanged.
#
# The two secrets are set only on the steps that need them: the check below,
# GoReleaser (the tap key) and the AUR step (the AUR key). The other actions
# never see them, and every action is pinned to a
# commit SHA (Renovate updates the pin and its version comment), so a moved tag
# upstream cannot run new code beside the keys.
name: pasadizo-release

on:
  push:
    tags: ["v*-pasadizo.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  ci:
    uses: ./.github/workflows/pasadizo-ci.yml
  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Read upstream's build tags and linker flags
        id: flags
        env:
          HOMEBREW_TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: |
          {
            echo "PASADIZO_TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
            echo "PASADIZO_TAGS_LINUX=$(cat release/DEFAULT_BUILD_TAGS),with_purego"
            echo "PASADIZO_LDFLAGS=$(cat release/LDFLAGS)"
          } >>"$GITHUB_ENV"
          skip=()
          if [ -z "$HOMEBREW_TAP_KEY" ]; then
            echo "::warning::HOMEBREW_TAP_KEY is not set; the Homebrew cask is not published."
            skip+=(homebrew)
          fi
          if [ -z "$AUR_KEY" ]; then
            echo "::warning::AUR_KEY is not set; the AUR package is not published."
            skip+=(aur)
          else
            echo "aur=true" >>"$GITHUB_OUTPUT"
          fi
          if [ "${#skip[@]}" -gt 0 ]; then
            echo "skip=--skip=$(IFS=,; echo "${skip[*]}")" >>"$GITHUB_OUTPUT"
          fi
      - name: Fetch libcronet.so for the Linux archives
        run: |
          set -euo pipefail
          version=$(cat .github/CRONET_GO_VERSION)
          paths=(lib/linux_amd64/libcronet.so lib/linux_arm64/libcronet.so lib/linux_arm/libcronet.so)
          git init -q "$RUNNER_TEMP/cronet-go"
          git -C "$RUNNER_TEMP/cronet-go" remote add origin https://github.com/sagernet/cronet-go.git
          git -C "$RUNNER_TEMP/cronet-go" sparse-checkout set --no-cone "${paths[@]/#//}"
          git -C "$RUNNER_TEMP/cronet-go" fetch -q --depth=1 --filter=blob:none origin "$version"
          git -C "$RUNNER_TEMP/cronet-go" checkout -q FETCH_HEAD
          for path in "${paths[@]}"; do
            mkdir -p ".cronet/$(basename "$(dirname "$path")")"
            cp "$RUNNER_TEMP/cronet-go/$path" ".cronet/$(basename "$(dirname "$path")")/"
          done
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes .github/RELEASE_NOTES.md ${{ steps.flags.outputs.skip }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
      - name: Publish the AUR package without stripping
        if: steps.flags.outputs.aur == 'true'
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: .github/pasadizo/aur-publish.sh "$GITHUB_REF_NAME"
