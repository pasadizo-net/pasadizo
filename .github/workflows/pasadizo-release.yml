# Release: on a tag like v1.15.0-alpha.14-pasadizo.2, run CI, then GoReleaser
# (.goreleaser.yaml): static binaries for linux amd64, arm64 and armv7 and
# darwin amd64 and arm64 in tar.gz archives, deb and rpm packages, checksums,
# a GitHub release, the Homebrew cask in pasadizo-net/homebrew-tap and the AUR
# package pasadizo-bin. Then attest the provenance of every file in
# checksums.txt.
#
# The Homebrew cask needs the secret HOMEBREW_TAP_TOKEN and the AUR package
# needs the secret AUR_KEY; without a secret, its step is skipped and the rest
# of the release still runs.
name: pasadizo-release

on:
  push:
    tags: ["v*-pasadizo.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  ci:
    uses: ./.github/workflows/pasadizo-ci.yml
  release:
    needs: ci
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      AUR_KEY: ${{ secrets.AUR_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Read upstream's build tags and linker flags
        id: flags
        run: |
          {
            echo "PASADIZO_TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
            echo "PASADIZO_LDFLAGS=$(cat release/LDFLAGS)"
          } >>"$GITHUB_ENV"
          skip=()
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the Homebrew cask is not published."
            skip+=(homebrew)
          fi
          if [ -z "$AUR_KEY" ]; then
            echo "::warning::AUR_KEY is not set; the AUR package is not published."
            skip+=(aur)
          fi
          if [ "${#skip[@]}" -gt 0 ]; then
            echo "skip=--skip=$(IFS=,; echo "${skip[*]}")" >>"$GITHUB_OUTPUT"
          fi
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes .github/RELEASE_NOTES.md ${{ steps.flags.outputs.skip }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/attest@v4
        with:
          subject-checksums: ./dist/checksums.txt
