# Pasadizo CI: build and test the packages Pasadizo changes, on every push to
# main and every pull request. Upstream's own workflows (lint.yml, test.yml)
# run only on upstream's branch names, so they do not run here.
name: pasadizo-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: The tree is renamed to Pasadizo
        run: |
          .github/pasadizo/rename.sh
          git diff --exit-code
      - name: Build (linux amd64 and arm64, release tags)
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -tags "$(cat release/DEFAULT_BUILD_TAGS_OTHERS)" \
              -ldflags "$(cat release/LDFLAGS) -s -w -buildid=" \
              -o /dev/null ./cmd/pasadizo
          done
      - name: Build (linux amd64, release tags with NaiveProxy over purego)
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -tags "$(cat release/DEFAULT_BUILD_TAGS),with_purego" \
            -ldflags "$(cat release/LDFLAGS) -s -w -buildid=" \
            -o /dev/null ./cmd/pasadizo
      - name: Vet and test the packages Pasadizo changes
        run: |
          pkgs=(. ./adapter/... ./common/fairshare/... ./common/trafficcontrol/... ./constant/...
            ./experimental/clashapi/... ./experimental/groupwebhook/... ./experimental/metrics/... ./include/... ./option/...
            ./protocol/gost/... ./protocol/group/... ./protocol/hysteria2/... ./protocol/masque/... ./route/...
            ./transport/http/... ./transport/masque/...)
          tags="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          go vet -tags "$tags" "${pkgs[@]}"
          # transport/masque needs -checklinkname=0 from release/LDFLAGS to link
          go test -race -count=1 -tags "$tags" -ldflags "$(cat release/LDFLAGS)" "${pkgs[@]}"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
